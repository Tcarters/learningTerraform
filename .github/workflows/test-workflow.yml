name: Run Job2 Even If Job1 Fails

on:
  push:
    branches:
      - feat/build-workflow
    paths:
        - ./config/**

jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run a script that might fail
        run: |
          echo "This is job1"
          exit 1  # Simulate a failure

  job2:
    runs-on: ubuntu-latest
    needs: job1  # Ensure job2 runs after job1
    if: always() # Run job2 even if job1 fails
    steps:
      - name: Run a script in job2
        run: |
          echo "This is job2"
          echo "Job2 ran even though job1 failed!"